name: Render AI LED animation
on:
  repository_dispatch:
    types: [generate_ai_effect]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout effects library
        uses: actions/checkout@v4
      - name: Checkout existing LED effect engine
        uses: actions/checkout@v4
        with:
          repository: Nedu41/LedPanel-Pico
          ref: master
          path: panel-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependencies
        run: python -m pip install numpy pillow
      - name: Render the existing Python effect as an animated GIF
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: python tools/render_cloud_effect.py
      - uses: actions/upload-artifact@v4
        with:
          name: led-effect-${{ github.event.client_payload.id }}
          path: out/${{ github.event.client_payload.id }}
          if-no-files-found: error
          retention-days: 1
  save:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: led-effect-${{ github.event.client_payload.id }}
          path: rendered
      - name: Save animation in the public effects library
        env:
          EFFECT_ID: ${{ github.event.client_payload.id }}
        run: |
          mkdir -p effects
          cp rendered/effect.gif "effects/$EFFECT_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "effects/$EFFECT_ID"
          git commit -m "Add generated LED animation"
          git push origin HEAD:main